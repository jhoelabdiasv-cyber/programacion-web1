<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - Registro de usuarios</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 15px; }
    label, input { display: block; margin: 8px 0; }
    input { padding: 8px; width: 95%; }
    button { padding: 8px 12px; margin: 8px 0; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: left; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Ejercicio 4: Registro de usuarios</h1>
  <p>Datos de práctica: no uses contraseñas reales.</p>
  <label for="nombre">Nombre:</label>
<input id="nombre" type="text" placeholder="Escribe tu nombre">
<label for="correo">Correo:</label>
<input id="correo" type="email" placeholder="ejemplo@correo.com">
<label for="clave">Clave ficticia:</label>
<input id="clave" type="password" placeholder="Clave de práctica">
  <button onclick="agregarUsuario()">Registrar usuario</button>
  <p id="contador"></p><label for="busqueda">Buscar por nombre:</label><input id="busqueda" type="text" placeholder="Nombre a buscar"><button onclick="buscarUsuario()">Buscar</button><p id="resultado"></p>
  <table>
    <thead><tr><th>Nombre</th><th>Correo</th><th>Clave ficticia</th></tr></thead>
    <tbody id="tablaUsuarios"></tbody>
  </table>
  <script>
    const CLAVE_STORAGE = "usuarios_ejercicio_4";
    let usuarios = JSON.parse(localStorage.getItem(CLAVE_STORAGE) || "[]");

    function agregarUsuario() {
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const clave = document.getElementById("clave").value;
      if (nombre === "") { alert("El nombre no puede estar vacío"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { alert("Correo no válido"); return; }
  if (clave.length < 6) { alert("La clave debe tener al menos 6 caracteres"); return; }
      const usuario = { nombre: nombre, correo: correo, clave: clave };
      usuarios.push(usuario);
      localStorage.setItem(CLAVE_STORAGE, JSON.stringify(usuarios));
      document.getElementById("nombre").value = "";
      document.getElementById("correo").value = "";
      document.getElementById("clave").value = "";
      mostrarUsuarios();
    }

    function mostrarUsuarios() {
      const tabla = document.getElementById("tablaUsuarios");
      tabla.innerHTML = "";
      usuarios.forEach((usuario, indice) => {
        const fila = tabla.insertRow();
        fila.insertCell().textContent = usuario.nombre;
        fila.insertCell().textContent = usuario.correo;
        fila.insertCell().textContent = "••••••";
        
      });
      document.getElementById("contador").textContent = "Usuarios registrados: " + usuarios.length;
    }
    function buscarUsuario() {
  const nombreBuscado = document.getElementById("busqueda").value.trim().toLowerCase();
  const usuario = usuarios.find(u => u.nombre.toLowerCase() === nombreBuscado);
  document.getElementById("resultado").textContent = usuario
    ? "Encontrado: " + usuario.nombre + " - " + usuario.correo
    : "Usuario no encontrado";
}
    
    mostrarUsuarios();
  </script>
</body>
</html>
